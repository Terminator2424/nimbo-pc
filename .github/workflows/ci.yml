name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -r requirements.txt coverage
      - name: Tests (Linux, con pantalla virtual)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb python3-tk
          xvfb-run -a python -m coverage run -m unittest discover -s tests -t .
          python -m coverage report
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t . -v
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt ruff mypy bandit pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy nimbo
      - run: bandit -q -r nimbo -c pyproject.toml
      - run: pip-audit -r requirements.txt
